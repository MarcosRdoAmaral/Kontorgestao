<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontor Gestão</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23fb923d%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="setup" class="login" hidden>
    <form id="form-setup" class="login-caixa">
      <img class="logo" src="/logo.png" alt="Kontor Gestão">
      <p class="chamada">Emissor de NFS-e. Vamos criar o primeiro acesso; seus dados ficam guardados somente neste computador.</p>
      <label>Nome do escritório <input name="escritorio" required autocomplete="organization"></label>
      <label>Seu nome <input name="nome" required autocomplete="name"></label>
      <label>E-mail de acesso <input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" minlength="8" required autocomplete="new-password"><span class="dica">Mínimo de 8 caracteres. Anote: não há como recuperá-la.</span></label>
      <label>Repita a senha <input name="senha2" type="password" minlength="8" required autocomplete="new-password"></label>
      <p class="erro" id="erro-setup" role="alert"></p>
      <button class="primario" type="submit">Criar acesso e começar</button>
    </form>
  </div>

  <div id="login" class="login" hidden>
    <form id="form-login" class="login-caixa">
      <img class="logo" src="/logo.png" alt="Kontor Gestão">
      <p class="chamada">Emissor de NFS-e pelo Sistema Nacional.</p>
      <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro" id="erro-login" role="alert"></p>
      <button class="primario" type="submit">Entrar</button>
    </form>
  </div>

  <div id="aviso-versao" class="aviso-versao" hidden></div>
  <div id="app" class="app" hidden>
    <aside class="lateral">
      <div class="marca"><img src="/logo.png" alt="Kontor Gestão"></div>
      <label class="seletor-empresa">
        <span>Empresa</span>
        <select id="empresa-atual"></select>
      </label>
      <div id="info-empresa" class="info-empresa"></div>
      <nav id="menu">
        <a href="#/painel">Painel do mês</a>
        <a href="#/emitir">Emitir nota</a>
        <a href="#/notas">Notas emitidas</a>
        <a href="#/tomadores">Tomadores</a>
        <a href="#/servicos">Serviços</a>
        <a href="#/empresas" data-papel="admin operador">Empresas</a>
        <a href="#/usuarios" data-papel="admin">Usuários</a>
        <a href="#/email" data-papel="admin">E-mail</a>
        <a href="#/backup" data-papel="admin">Backup</a>
      </nav>
      <div class="usuario">
        <span id="nome-usuario"></span>
        <button id="sair" class="link">Sair</button>
      </div>
      <div class="versao sutil" id="versao"></div>
    </aside>
    <main id="conteudo" tabindex="-1"></main>
  </div>

  <dialog id="dialogo"><div id="dialogo-corpo"></div></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
